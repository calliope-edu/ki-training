name: calliope-build

# Builds the editor twice and pushes both builds to a build branch, one commit
# per build:
#
#   /                  the trainer on its own address (ki-training.calliope.cc)
#   /editors/ki-training/
#                      the trainer as Calliope Campus embeds it (its
#                      KI-Training editor): Campus serves it itself under that
#                      path on its own origin (calliope-campus docs/editors.md)
#
# Which branch:
#
#   tag calliope-vX.Y.Z      → build-live  (ki-training.calliope.cc; Campus pins it)
#   push to calliope-main    → build-dev   (ki-training-dev.calliope.cc)
#
# calliope-ui and the connection widget follow the build's channel
# (resolve-calliope-deps, from calliope-ui): a dev build takes their newest
# commit on calliope-main, a live build their newest release tag within the
# major package.json pins.
#
# Each build branch is ready to serve as it is: a Cloudflare Pages project on it
# needs no build command and the repository root as its output directory. Each
# commit carries BUILD.json (at the root and in editors/ki-training/, format in
# docs/build-info.md) naming the channel, version, source commit and the states
# of calliope-ui and the widget; the app compiles in the same values and shows
# them at the bottom of its settings menu. Campus pins a commit of build-live as its editors/ki-training
# submodule and moves the pin itself, so nothing built here reaches
# campus.calliope.cc unreviewed.
#
# The build branches only ever grow: Campus release tags pin their older
# commits, so rewriting them would break those builds.

on:
  push:
    branches:
      - calliope-main
    tags:
      - calliope-v*
  workflow_dispatch:

# One build after the other per build branch, so every build lands in order.
concurrency:
  group: calliope-build-${{ github.ref_type }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Rewrites the pins of calliope-ui and the widget in package.json to the
      # channel's state (dev: newest commit on calliope-main; live: newest tag).
      - name: Resolve calliope-ui and the widget
        id: deps
        uses: calliope-edu/calliope-ui/.github/actions/resolve-calliope-deps@calliope-main

      # One set of build values for both builds and their BUILD.json
      # (bin/build-info.cjs; vite.config.ts compiles them in).
      - name: Build info
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          DEPS: ${{ steps.deps.outputs.json }}
        run: |
          channel=dev
          if [ "$REF_TYPE" = tag ]; then channel=live; fi
          {
            echo "BUILD_CHANNEL=$channel"
            echo "BUILD_VERSION=$REF_NAME"
            echo "BUILD_COMMIT=$SHA"
            echo "BUILD_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "BUILD_DEPS=$DEPS"
          } >> "$GITHUB_ENV"

      # Everything else as the lockfile has it; the two Calliope packages are
      # named explicitly, as npm keeps a git dependency's locked commit
      # otherwise. postinstall generates the Chakra theme typings the type
      # check needs and patches the widget's connection library.
      - name: Install
        run: |
          specs=$(node -p "const d = require('./package.json').dependencies; ['@calliope-edu/ui', '@calliope-edu/mini-connection-widget'].map((n) => n + '@' + d[n]).join(' ')")
          echo "$specs"
          npm install --no-audit --no-fund $specs

      - name: Build for the site root
        run: npm run build && rm -f dist/test.html && mkdir -p "$RUNNER_TEMP/out" && cp -r dist/. "$RUNNER_TEMP/out/"
        env:
          VITE_STAGE: PRODUCTION
          NODE_OPTIONS: --max-old-space-size=4096

      - name: Build for Campus (/editors/ki-training/)
        run: npm run build && rm -f dist/test.html && mkdir -p "$RUNNER_TEMP/out/editors/ki-training" && cp -r dist/. "$RUNNER_TEMP/out/editors/ki-training/"
        env:
          # Vite's base: every asset and route is prefixed with this path.
          BASE_URL: /editors/ki-training/
          # The canonical link, og:image and favicon in index.html.
          VITE_FULL_URL: /editors/ki-training/
          VITE_STAGE: PRODUCTION
          # Leaves out the go.calliope.cc consent/analytics script and styles
          # (vite.config.ts): on Campus's origin it would run with Campus's rights.
          CAMPUS_DIST: "1"
          NODE_OPTIONS: --max-old-space-size=4096

      - name: Push the build
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SOURCE_SHA: ${{ github.sha }}
          SOURCE_REF: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          set -euo pipefail
          name=ki-training
          target=build-dev
          if [ "$REF_TYPE" = tag ]; then target=build-live; fi
          short=${SOURCE_SHA:0:7}
          out="$RUNNER_TEMP/out"
          # The same values both builds compiled in (step "Build info").
          node bin/build-info.cjs > "$out/BUILD.json"
          cp "$out/BUILD.json" "$out/editors/$name/BUILD.json"
          cat "$out/BUILD.json"
          mkdir publish && cd publish
          git init -q
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git"
          if git fetch -q --depth 1 origin "$target"; then
            git checkout -q -b "$target" FETCH_HEAD
          else
            git checkout -q --orphan "$target"
          fi
          git rm -rqf --ignore-unmatch .
          cp -r "$out/." .
          # Build output, kept byte for byte: no line-ending conversion on checkout.
          printf '# Build output, kept byte for byte (no line-ending conversion on checkout).\n* -text\n' > .gitattributes
          git add -A
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -q -m "build ${short} from ${SOURCE_REF}" -m "Source: https://github.com/${REPO}/commit/${SOURCE_SHA}"
          git push -q origin "$target"
          echo "### ${target}: build ${short} from ${SOURCE_REF}" >> "$GITHUB_STEP_SUMMARY"
